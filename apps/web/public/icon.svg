<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#0D0E11"/>
  <!-- Outer glowing border -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="#4FB6E3" stroke-width="8" stroke-opacity="0.4"/>
  <!-- Corner accents -->
  <path d="M 40 120 L 40 40 L 120 40" fill="none" stroke="#FF5A5F" stroke-width="12" stroke-linecap="round"/>
  <path d="M 472 392 L 472 472 L 392 472" fill="none" stroke="#FF5A5F" stroke-width="12" stroke-linecap="round"/>
  <!-- Cyberpunk grid lines -->
  <line x1="64" y1="256" x2="448" y2="256" stroke="#4FB6E3" stroke-width="2" stroke-opacity="0.2"/>
  <line x1="256" y1="64" x2="256" y2="448" stroke="#4FB6E3" stroke-width="2" stroke-opacity="0.2"/>
  <!-- Main Logo Mark: CPGM Stylized Hexagon & Crosshairs -->
  <polygon points="256,110 380,182 380,330 256,402 132,330 132,182" fill="#1A1D24" stroke="#4FB6E3" stroke-width="14" stroke-linejoin="round"/>
  <!-- Neon Inner Core -->
  <polygon points="256,150 340,198 340,314 256,362 172,314 172,198" fill="#0D0E11" stroke="#FF5A5F" stroke-width="6"/>
  <!-- Center Text CPGM -->
  <text x="256" y="272" font-family="'Chakra Petch', 'JetBrains Mono', sans-serif" font-weight="900" font-size="64" fill="#4FB6E3" text-anchor="middle" letter-spacing="4">CPGM</text>
  <text x="256" y="304" font-family="sans-serif" font-weight="700" font-size="16" fill="#FF5A5F" text-anchor="middle" letter-spacing="8">OFFLINE</text>
</svg>
